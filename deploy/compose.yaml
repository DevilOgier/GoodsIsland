name: goods-island
services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: guzi
      POSTGRES_USER: guzi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U guzi]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    image: ${APP_IMAGE:?Set APP_IMAGE}
    env_file: .env
    volumes: [image-data:/app/data/objects]
    environment:
      WEB_HOST: 0.0.0.0
      PORT: 3000
      LOCAL_SERVICES: 'false'
    restart: unless-stopped
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
  worker:
    image: ${APP_IMAGE:?Set APP_IMAGE}
    command: [node, --import, tsx, src/workers/image-worker.ts]
    env_file: .env
    volumes: [image-data:/app/data/objects]
    environment:
      LOCAL_SERVICES: 'false'
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS}
    ports: ['80:80', '443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web: { condition: service_healthy }
volumes:
  image-data:
  postgres-data:
  caddy-data:
  caddy-config:
