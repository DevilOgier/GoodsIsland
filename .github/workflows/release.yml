name: Release GoodsIsland
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: goods-island-production
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: guzi
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: guzi
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U guzi" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://guzi:ci-test-only@localhost:5432/guzi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@11.19.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm exec next typegen && pnpm lint && pnpm typecheck && pnpm test
      - run: pnpm exec prisma migrate deploy && pnpm exec tsx prisma/seed.ts
      - run: pnpm exec tsx --test --test-concurrency=1 tests/integration/*.test.ts
  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      reference: ${{ steps.reference.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: name
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.name.outputs.value }}:${{ github.sha }}
      - id: reference
        env:
          NAME: ${{ steps.name.outputs.value }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "value=$NAME@$DIGEST" >> "$GITHUB_OUTPUT"
  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Deploy immutable image
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          IMAGE: ${{ needs.image.outputs.reference }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          port="${DEPLOY_PORT:-22}"
          [[ "$port" =~ ^[0-9]+$ ]]
          [[ "$IMAGE" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$ ]]
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -P "$port" deploy/compose.yaml deploy/Caddyfile deploy/update.sh "$DEPLOY_USER@$DEPLOY_HOST:/opt/goods-island/"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$port" "$DEPLOY_USER@$DEPLOY_HOST" "bash /opt/goods-island/update.sh '$IMAGE'"
